dataset:
  cache_dir: input
  hf_repo: txya900619/vggsound-16k
  name: VGGSound
  samples_per_class: 100
  split: train
  streaming: false
evaluation:
  results_dir: results/eval_outputs
  top_k_list:
  - 1
  - 5
  - 10
execution:
  batch_size: 16
  device: cuda
  output_dir: results/eval_outputs
  strategy: sequential
  use_accelerate: true
models:
- enabled: true
  hf_model_id: laion/clap-htsat-unfused
  name: laion
  type: huggingface
