dataset:
  name: "VGGSound"
  csv_path: "input/vggsound.csv"
  audio_dir: "input/audio"  # Path to the downloaded/extracted audio files corresponding to the YouTube IDs
  samples_per_class: 100   # How many samples to run inference per category. Selects 0 to 99.

# Models are automatically downloaded via HuggingFace's from_pretrained
models:
  - name: "laion"
    hf_model_id: "laion/clap-htsat-unfused"  # Native HF Transformers CLAP
    enabled: true
  - name: "mga"
    hf_model_id: "microsoft/msclap"         # Example assuming a fictional or unofficial HF port. Use official API if needed.
    enabled: true
  - name: "m2d"
    hf_model_id: "m2d/clap-base"            # Example HF tag for M2D model
    enabled: true

execution:
  batch_size: 8
  device: "cuda"  # e.g., 'mps' on Mac, 'cpu', 'cuda'
  output_dir: "results/eval_outputs"
  
  # Accelerate config specifies how memory is managed.
  # Memory Analysis: Loading all 3 models takes roughly 3-5GB of VRAM just for weights. 
  # Strategy: 'sequential' is most efficient. Load model 1 -> Infer 310 types -> Offload memory -> Load model 2 -> Infer 310 types -> Offload memory. 
  # This maximizes the batch_size possible for a single GPU.
  strategy: "sequential"
  use_accelerate: true # Automatically handles mixed precision (fp16) and intelligent device placement.
