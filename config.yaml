dataset:
  name: "VGGSound"
  csv_path: "input/vggsound.csv"
  audio_dir: "input/audio" # (Optional fallback)
  stream_audio: true       # Use lazy in-memory YouTube loading via yt-dlp/ffmpeg
  samples_per_class: 100

models:
  - name: "laion"
    type: "huggingface" # HF automated load
    hf_model_id: "laion/clap-htsat-unfused" 
    enabled: true
  - name: "mga"
    type: "local" # Cloned repo + local checkpoint
    repo_path: "models_third_party/MGA-CLAP"
    checkpoint_path: "checkpoints/mga-clap.pt"
    enabled: true
  - name: "m2d"
    type: "local"
    repo_path: "models_third_party/m2d"
    checkpoint_path: "checkpoints/m2d_clap_vit_base-80x1001p16x16p16kpBpTI-2025/checkpoint-30.pth"
    enabled: true

execution:
  batch_size: 8
  device: "cuda"
  output_dir: "results/eval_outputs"
  strategy: "sequential"
  use_accelerate: true
