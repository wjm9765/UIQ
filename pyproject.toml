[project]
name = "clap_eval"
version = "0.1.0"
description = "Evaluation Pipeline for CLAP Models (LAION, MGA, M2D)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "accelerate",
    "pyyaml>=6.0",
    "tqdm",
    "pandas",
    "librosa",
    "numpy",
    "yt-dlp",
    "ffmpeg-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clap_eval"]
